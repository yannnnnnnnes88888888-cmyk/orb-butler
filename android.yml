name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: sdk
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: organize
        run: |
          mkdir -p app/src/main/java/cn/workbuddy/orb app/src/main/assets app/src/main/res/layout app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          for f in BootReceiver FloatingService MainActivity Notifier OrbView PetView Prefs ReminderReceiver; do
            if [ -f "$f.java" ]; then mv "$f.java" app/src/main/java/cn/workbuddy/orb/; fi
          done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f index.html ]; then mv index.html app/src/main/assets/; fi
          if [ -f activity_main.xml ]; then mv activity_main.xml app/src/main/res/layout/; fi
          for f in bg_btn bg_btn_primary bg_card ic_launcher_background ic_launcher_foreground ic_stat_orb; do
            if [ -f "$f.xml" ]; then mv "$f.xml" app/src/main/res/drawable/; fi
          done
          if [ -f ic_launcher.xml ]; then mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/; fi
          for f in colors strings styles; do
            if [ -f "$f.xml" ]; then mv "$f.xml" app/src/main/res/values/; fi
          done
          if [ -f pet.png ]; then
            mv pet.png app/src/main/res/drawable/
            cp app/src/main/res/drawable/pet.png app/src/main/assets/pet.png
          fi

      - name: config
        run: |
          rm -f build.gradle settings.gradle gradle.properties
          printf '%s\n' 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}' 'dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}' 'rootProject.name="OrbButler"' "include ':app'" > settings.gradle
          printf '%s\n' "plugins{id 'com.android.application' version '8.1.4' apply false}" > build.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m' 'android.useAndroidX=true' > gradle.properties
          V=app/src/main/res/values
          if [ ! -f $V/colors.xml ]; then printf '%s\n' '<resources><color name="bg">#F0F2F5</color><color name="card">#FFFFFF</color><color name="text">#1C1E21</color><color name="text2">#65676B</color><color name="primary">#0064E0</color></resources>' > $V/colors.xml; fi
          if [ ! -f $V/strings.xml ]; then printf '%s\n' '<resources><string name="app_name">光球管家</string></resources>' > $V/strings.xml; fi
          if [ ! -f $V/styles.xml ]; then printf '%s\n' '<resources><style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"><item name="android:windowBackground">@color/bg</item></style></resources>' > $V/styles.xml; fi
          echo "plugins{id 'com.android.application'}" > app/build.gradle
          echo 'android{' >> app/build.gradle
          echo "  namespace 'cn.workbuddy.orb'" >> app/build.gradle
          echo '  compileSdk 34' >> app/build.gradle
          echo '  defaultConfig{applicationId "cn.workbuddy.orb"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0"}' >> app/build.gradle
          echo '  compileOptions{sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17}' >> app/build.gradle
          echo '  lint{abortOnError false; checkReleaseBuilds false}' >> app/build.gradle
          echo '  signingConfigs{release{def k=rootProject.file("orb.jks"); if(k.exists()){storeFile k; storePassword "orb1234"; keyAlias "orb"; keyPassword "orb1234"}}}' >> app/build.gradle
          echo '  buildTypes{release{minifyEnabled false; if(rootProject.file("orb.jks").exists()){signingConfig signingConfigs.release}else{signingConfig signingConfigs.debug}}}' >> app/build.gradle
          echo '}' >> app/build.gradle

      - name: verify
        run: |
          miss=0
          for p in app/src/main/AndroidManifest.xml app/src/main/assets/index.html \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/drawable/bg_card.xml app/src/main/res/drawable/bg_btn.xml \
            app/src/main/res/drawable/bg_btn_primary.xml app/src/main/res/drawable/ic_stat_orb.xml \
            app/src/main/res/drawable/ic_launcher_background.xml app/src/main/res/drawable/ic_launcher_foreground.xml \
            app/src/main/java/cn/workbuddy/orb/MainActivity.java \
            app/src/main/java/cn/workbuddy/orb/FloatingService.java \
            app/src/main/java/cn/workbuddy/orb/OrbView.java \
            app/src/main/java/cn/workbuddy/orb/PetView.java \
            app/src/main/java/cn/workbuddy/orb/Notifier.java \
            app/src/main/java/cn/workbuddy/orb/Prefs.java \
            app/src/main/java/cn/workbuddy/orb/ReminderReceiver.java \
            app/src/main/java/cn/workbuddy/orb/BootReceiver.java; do
            if [ ! -f "$p" ]; then echo "MISSING: $p"; miss=1; fi
          done
          if [ "$miss" = "1" ]; then exit 1; fi
          echo "### 文件体检通过，开始编译 ###"

      - name: gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/opt"
          echo "$HOME/opt/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: build
        run: |
          keytool -genkeypair -v -keystore orb.jks -keyalg RSA -keysize 2048 -validity 10950 -storepass orb1234 -keypass orb1234 -alias orb -dname "CN=Orb"
          gradle assembleRelease assembleDebug --no-daemon --stacktrace
          
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
