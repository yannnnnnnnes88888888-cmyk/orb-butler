<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
/* ===== 原生桥接前奏：让网页里的提醒变成真正的系统通知 ===== */
(function () {
  var KEY = 'ptb.state.v1';
  function has(k) { return !!(window.OrbNative && typeof window.OrbNative[k] === 'function'); }

  /* 1) 打开 App 时把上次的任务快照还给网页 */
  try {
    if (has('getTasksJson') && !localStorage.getItem(KEY)) {
      var t = window.OrbNative.getTasksJson();
      if (t && t.length > 4) localStorage.setItem(KEY, t);
    }
  } catch (e) {}

  /* 2) 每次保存都同步给原生，原生据此排精确闹钟 */
  var _set = null;
  try { _set = Storage.prototype.setItem; } catch (e) {}
  if (_set) {
    Storage.prototype.setItem = function (k, v) {
      try { _set.call(this, k, v); } catch (e) {}
      if (k === KEY) { try { if (has('saveTasks')) window.OrbNative.saveTasks(v); } catch (e) {} }
    };
  }

  /* 3) 用系统通知渠道替换浏览器通知（没授权时保留原来的应用内横幅） */
  try {
    function OrbNotification(title, opts) {
      opts = opts || {};
      try { if (has('notify')) window.OrbNative.notify(String(title || ''), String(opts.body || ''), opts.orbKind || 'normal'); } catch (e) {}
    }
    OrbNotification.requestPermission = function (cb) {
      var p = 'denied';
      try { p = (has('hasNotifPermission') && window.OrbNative.hasNotifPermission()) ? 'granted' : 'denied'; } catch (e) {}
      if (p === 'denied' && has('openPermissionSettings')) { try { window.OrbNative.openPermissionSettings(); } catch (e) {} }
      if (cb) cb(p);
      return Promise.resolve(p);
    };
    Object.defineProperty(OrbNotification, 'permission', {
      get: function () {
        try { return (has('hasNotifPermission') && window.OrbNative.hasNotifPermission()) ? 'granted' : 'denied'; }
        catch (e) { return 'denied'; }
      }
    });
    if (OrbNotification.permission === 'granted') window.Notification = OrbNotification;
  } catch (e) {}

  /* 4) 给网页用的：让悬浮光球变色 */
  window.__orbPing = function (kind) { try { if (has('ping')) window.OrbNative.ping(kind || 'warn'); } catch (e) {} };
  window.__orbOrb = {
    start: function () { try { if (has('startOrb')) window.OrbNative.startOrb(); } catch (e) {} },
    stop: function () { try { if (has('stopOrb')) window.OrbNative.stopOrb(); } catch (e) {} },
    hide: function () { try { if (has('collapseOrb')) window.OrbNative.collapseOrb(); } catch (e) {} }
  };
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>团仔 · 桌宠任务管家</title>
<style>
/* 团仔 · 桌宠任务管家 —— Meta 风格 UI（亮色为主，夜间自动深色） */
:root{
  /* Meta 系主色 */
  --blue:#0064E0;
  --blue-2:#1877F2;
  --blue-soft:#E7F0FF;
  --grad:linear-gradient(135deg,#0064E0 0%,#5B4BFF 100%);
  --ig:linear-gradient(135deg,#F58529 0%,#DD2A7B 42%,#8134AF 72%,#515BD4 100%);
  --ok:#1DB954;
  --warn:#F5A623;
  --danger:#FA383E;

  --bg:#F0F2F5;
  --surface:#FFFFFF;
  --surface-2:#F5F6F8;
  --field:#EFF1F4;
  --line:rgba(0,0,0,.09);
  --text:#1C1E21;
  --dim:#666A70;

  --r-lg:24px;
  --r-md:18px;
  --r-sm:12px;
  --shadow-1:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07);
  --shadow-2:0 4px 12px rgba(0,0,0,.08),0 18px 40px rgba(0,0,0,.12);
  --shadow-blue:0 6px 18px rgba(0,100,224,.32);
  color-scheme:light dark;

  /* 光球配色（随情绪变化） */
  --orb-a:#0064E0;
  --orb-b:#7B61FF;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B0D12;
    --surface:#171A21;
    --surface-2:#1F232C;
    --field:#22262F;
    --line:rgba(255,255,255,.1);
    --text:#E9EBF0;
    --dim:#9AA0AB;
    --blue-soft:#14294a;
    --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
    --shadow-2:0 8px 24px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.45);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 12% -8%,rgba(0,100,224,.16),transparent 60%),
    radial-gradient(700px 480px at 100% 8%,rgba(123,47,247,.16),transparent 58%),
    var(--bg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;touch-action:manipulation}
input,select,textarea{font-family:inherit;touch-action:manipulation}
.bg-deco{display:none}

/* ==================== 光球桌宠 ==================== */
.pet-dock{
  position:fixed;z-index:70;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:right .32s cubic-bezier(.3,1,.4,1),bottom .32s cubic-bezier(.3,1,.4,1);
}
/* 点击区域（.pet-stage）保持静止，浮动只作用在内层 SVG 上 —— 手指/自动化都好点 */
.pet-stage{
  position:relative;width:126px;height:126px;cursor:grab;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.18));
}
.pet-stage:active{cursor:grabbing}
@keyframes hoverY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pet-svg{width:100%;height:100%;display:block;overflow:visible;animation:hoverY 5.2s ease-in-out infinite}
#pet-stage img.pet-svg{object-fit:contain;transform-origin:50% 50%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.14))}
.pet-stage[data-mood="sleep"] img.pet-svg{opacity:.72;filter:saturate(.75) drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.pet-stage[data-mood="alert"] img.pet-svg{filter:drop-shadow(0 0 10px rgba(250,56,62,.45))}
.pet-stage[data-mood="happy"] img.pet-svg{filter:drop-shadow(0 0 10px rgba(245,166,35,.4))}

/* 情绪配色 */
.pet-stage{--orb-a:#0064E0;--orb-b:#7B61FF}
.pet-stage[data-mood="happy"]{--orb-a:#F5A623;--orb-b:#FF6B9D}
.pet-stage[data-mood="alert"]{--orb-a:#FA383E;--orb-b:#FF8A3D}
.pet-stage[data-mood="worry"]{--orb-a:#F5A623;--orb-b:#FF7A59}
.pet-stage[data-mood="sleep"]{--orb-a:#3F51B5;--orb-b:#5C6BC0}
.pet-stage[data-mood="focus"]{--orb-a:#5B4BFF;--orb-b:#00C2A8}

.orb-core{transform-origin:60px 60px;animation:orbPulse 3.6s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06,1.04)}}
.orb-halo{transform-origin:60px 60px;animation:halo 4.2s ease-in-out infinite;opacity:.55}
.orb-halo-2{transform-origin:60px 60px;animation:halo 4.2s ease-in-out infinite -1.4s;opacity:.35}
@keyframes halo{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.12);opacity:.7}}
.orb-ring{transform-origin:60px 60px;animation:spin 7s linear infinite;stroke-linecap:round}
.orb-ring-2{animation:spin 11s linear infinite reverse;opacity:.45}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orb-shine{animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.34;transform:translate(0,0)}50%{opacity:.5;transform:translate(2px,2px)}}
.orb-sparks{animation:spin 12s linear infinite;transform-origin:60px 60px}
.orb-sparks .sp{animation:flicker 2.4s ease-in-out infinite}
.orb-sparks .sp2{animation-delay:.4s}
.orb-sparks .sp3{animation-delay:.8s}
.orb-sparks .sp4{animation-delay:1.2s}
@keyframes flicker{0%,100%{opacity:.25}50%{opacity:.95}}
.pet-stage[data-mood="happy"] .orb-core{animation:orbPulse 3.6s ease-in-out infinite,hop .6s ease 2}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(.95,1.05)}70%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
.pet-stage[data-mood="alert"] .orb-core{animation:shake .45s ease 3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pet-stage[data-mood="sleep"] .orb-core{animation:orbPulse 6s ease-in-out infinite}

/* 表情切换 */
.eyes{display:none}
.pet-stage[data-mood="idle"] .eyes-open,
.pet-stage[data-mood="happy"] .eyes-open,
.pet-stage[data-mood="focus"] .eyes-open{display:block}
.pet-stage[data-mood="worry"] .eyes-worry{display:block}
.pet-stage[data-mood="alert"] .eyes-worry{display:block}
.pet-stage[data-mood="sleep"] .eyes-closed{display:block}
.pet-stage.blinking .eyes-open{display:none}
.pet-stage.blinking .eyes-closed{display:block}
.mouth{display:none}
.pet-stage[data-mood="idle"] .mouth-flat,
.pet-stage[data-mood="focus"] .mouth-flat,
.pet-stage[data-mood="worry"] .mouth-flat{display:block}
.pet-stage[data-mood="happy"] .mouth-smile{display:block}
.pet-stage[data-mood="alert"] .mouth-oh{display:block}
.pet-stage[data-mood="sleep"] .mouth-smile{display:block}
.zzz{display:none}
.pet-stage[data-mood="sleep"] .zzz{display:block}
.zzz text{fill:var(--dim);font-weight:800;font-family:inherit}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tailWag 3s ease-in-out infinite}
.pet-stage[data-mood="happy"] .tail{animation:tailWag 1.1s ease-in-out infinite}
.pet-stage[data-mood="sleep"] .tail{animation:none}
@keyframes tailWag{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
.z1{font-size:13px;animation:zfloat 2.4s ease-in-out infinite}
.z2{font-size:16px;animation:zfloat 2.4s ease-in-out infinite .3s}
.z3{font-size:20px;animation:zfloat 2.4s ease-in-out infinite .6s}
@keyframes zfloat{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}

.pet-badge{
  position:absolute;top:4px;right:4px;min-width:24px;height:24px;padding:0 7px;
  border-radius:12px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);
  box-shadow:0 4px 10px rgba(250,56,62,.4)
}
.hidden{display:none !important}

/* 气泡：Messenger 风格 */
.bubble{position:relative;max-width:min(290px,72vw);animation:bubbleIn .3s cubic-bezier(.2,1.25,.4,1)}
@keyframes bubbleIn{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
.bubble-inner{
  background:var(--surface);color:var(--text);
  padding:13px 15px;border-radius:20px 20px 6px 20px;box-shadow:var(--shadow-2);
  font-size:14.5px;line-height:1.6;border:1px solid var(--line);
}
.bubble-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.bubble-actions button{
  border:0;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;min-height:38px;
  background:var(--blue-soft);color:var(--blue);font-weight:700
}
.bubble-actions button.ghost{background:var(--surface-2);color:var(--dim);font-weight:600}
.bubble-x{
  position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
  border:0;background:var(--surface);color:var(--dim);cursor:pointer;font-size:16px;line-height:1;
  box-shadow:var(--shadow-1);border:1px solid var(--line)
}
.pet-toolbar{display:flex;gap:8px}
.pt-btn{
  width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:17px;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);border:1px solid var(--line)
}
.pt-btn:active{transform:scale(.93)}

/* ==================== 面板 ==================== */
.panel{
  position:fixed;z-index:60;top:14px;right:14px;bottom:14px;width:404px;max-width:calc(100vw - 20px);
  background:var(--surface);border-radius:26px;box-shadow:var(--shadow-2);border:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(0);transition:transform .32s cubic-bezier(.3,1,.4,1),opacity .28s;
}
.panel.collapsed{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;background:var(--surface)}
.pet-mini{display:flex;gap:11px;align-items:center;min-width:0}
.pet-mini .avatar{
  width:42px;height:42px;border-radius:50%;flex:0 0 42px;
  background:radial-gradient(circle at 36% 30%, #ffffff 0%, var(--orb-b) 42%, var(--orb-a) 100%);
  box-shadow:var(--shadow-blue);position:relative;transition:background .3s
}
.pet-mini .avatar::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:2px solid var(--orb-b);opacity:.35;animation:pulseRing 2s ease-in-out infinite
}
.pet-mini .avatar[data-mood="idle"]{--orb-a:#0064E0;--orb-b:#7B61FF}
.pet-mini .avatar[data-mood="happy"]{--orb-a:#F5A623;--orb-b:#FF6B9D}
.pet-mini .avatar[data-mood="alert"]{--orb-a:#FA383E;--orb-b:#FF8A3D}
.pet-mini .avatar[data-mood="worry"]{--orb-a:#F5A623;--orb-b:#FF7A59}
.pet-mini .avatar[data-mood="sleep"]{--orb-a:#3F51B5;--orb-b:#5C6BC0}
.pet-mini .avatar[data-mood="focus"]{--orb-a:#5B4BFF;--orb-b:#00C2A8}
#pet-mini-face{font-size:20px;line-height:1}
.panel-title{font-weight:800;font-size:16.5px;letter-spacing:.2px}
.panel-sub{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.conn-dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.conn-dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(29,185,84,.18)}
.conn-dot.err{background:var(--danger);box-shadow:0 0 0 3px rgba(250,56,62,.18)}
.icon-btn{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:19px;cursor:pointer;line-height:1}

/* Segmented control（Meta 风格） */
.tabs{display:flex;gap:4px;margin:2px 14px 8px;padding:4px;background:var(--surface-2);border-radius:14px}
.tab{
  flex:1;border:0;background:transparent;color:var(--dim);padding:9px 0;border-radius:11px;
  font-size:13.5px;cursor:pointer;font-weight:700;min-height:38px;transition:.2s
}
.tab.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-1)}
.tab-body{display:none;flex:1;min-height:0;overflow-y:auto;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.tab-body.active{display:flex;flex-direction:column;gap:11px;padding-top:4px}
::-webkit-scrollbar{width:0;height:0}

/* 对话 */
.chat-log{flex:1;min-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px 4px 0}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:var(--shadow-blue)}
.msg.pet{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:var(--surface-2);color:var(--dim);font-size:11.5px;text-align:center;border-radius:12px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:12.5px;cursor:pointer;
  background:var(--surface-2);color:var(--dim);font-weight:600;min-height:38px
}
.chip:active{transform:scale(.97)}
.composer{display:flex;gap:9px;align-items:flex-end;padding-top:2px}
.composer textarea{
  flex:1;resize:none;max-height:120px;border-radius:20px;padding:12px 14px;font:inherit;font-size:14px;
  background:var(--field);border:1px solid transparent;color:var(--text);outline:none;min-height:44px
}
.composer textarea:focus{border-color:var(--blue);background:var(--surface)}
.send-btn{
  border:0;border-radius:20px;padding:0 18px;min-height:44px;cursor:pointer;font-weight:700;color:#fff;
  background:var(--grad);box-shadow:var(--shadow-blue);font-size:14px
}
.send-btn[disabled]{opacity:.5}

/* 任务 */
.quick-form{display:flex;gap:9px}
.quick-form input{
  flex:1;border-radius:20px;padding:12px 14px;font:inherit;font-size:14px;min-height:44px;
  background:var(--field);border:1px solid transparent;color:var(--text);outline:none
}
.quick-form input:focus{border-color:var(--blue);background:var(--surface)}
.task-groups{display:flex;flex-direction:column;gap:6px}
.group-title{font-size:12px;color:var(--dim);margin:8px 0 2px;font-weight:700;display:flex;align-items:center;gap:6px}
.group-title b{color:var(--text);font-size:12px;background:var(--surface-2);border-radius:999px;padding:1px 8px}
.task{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--shadow-1);transition:.18s
}
.task.done{opacity:.5}
.task.overdue{border-color:rgba(250,56,62,.4);background:rgba(250,56,62,.05)}
.task.doing{border-color:rgba(0,100,224,.4);background:rgba(0,100,224,.05)}
.tick{
  width:24px;height:24px;flex:0 0 24px;border-radius:8px;border:2px solid var(--dim);
  background:transparent;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;transition:.15s
}
.task.done .tick{background:var(--ok);border-color:var(--ok)}
.t-main{flex:1;min-width:0}
.t-title{font-size:14.5px;font-weight:700;line-height:1.45}
.task.done .t-title{text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11.5px;color:var(--dim)}
.m-chip{background:var(--surface-2);border-radius:8px;padding:3px 8px;font-weight:600}
.m-chip.hot{background:rgba(250,56,62,.12);color:var(--danger)}
.m-chip.soon{background:rgba(245,166,35,.16);color:#a4650a}
.m-chip.ok{background:rgba(29,185,84,.14);color:#0d8f43}
.t-ops{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.t-op{
  border:1px solid var(--line);background:var(--surface-2);color:var(--dim);border-radius:11px;
  padding:8px 11px;font-size:12.5px;cursor:pointer;font-weight:600;min-height:36px
}
.t-op:active{transform:scale(.96)}
.t-op.del{color:var(--danger)}
.sub-list{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.sub{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--dim);line-height:1.5}
.sub.done{text-decoration:line-through;opacity:.55}
.sub input{accent-color:var(--blue);width:17px;height:17px;margin-top:1px}
.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:30px 12px;line-height:1.75}

/* 日程 */
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:13px}
.plan-date{font-weight:800;font-size:15px}
.plan-summary{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.6}
.timeline{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.tl-row{display:flex;gap:10px;align-items:stretch;min-height:28px}
.tl-time{width:46px;flex:0 0 46px;font-size:11.5px;color:var(--dim);padding-top:6px;text-align:right;font-variant-numeric:tabular-nums}
.tl-body{flex:1;border-left:2px solid var(--line);padding:2px 0 2px 12px}
.tl-block{border-radius:12px;padding:8px 11px;font-size:13px;margin-bottom:5px;background:var(--blue-soft);border:1px solid rgba(0,100,224,.25);color:var(--text);font-weight:600}
.tl-block.free{background:transparent;border:1px dashed var(--line);color:var(--dim);font-weight:500}
.tl-block.now{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-blue)}
.focus-box{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-1)
}
.focus-clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
.focus-label{font-size:12.5px;color:var(--dim);margin-top:3px;max-width:180px}
.focus-right{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.primary-btn{border:0;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700;color:#fff;background:var(--grad);box-shadow:var(--shadow-blue);min-height:42px;font-size:13.5px}
.ghost-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--dim);border-radius:14px;
  padding:10px 13px;cursor:pointer;font-size:13px;font-weight:600;min-height:42px
}
.ghost-btn:active{transform:scale(.97)}
.ghost-btn.danger{color:var(--danger)}
.plan-tools{display:flex;gap:8px;flex-wrap:wrap}

/* 设置 */
.set-group{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-1)
}
.set-title{font-size:12px;color:var(--dim);font-weight:800;letter-spacing:.6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.field span{font-size:12.5px;font-weight:600}
.field input,.field select{
  background:var(--field);border:1px solid transparent;color:var(--text);
  border-radius:14px;padding:12px 13px;font:inherit;font-size:14px;outline:none;width:100%;min-height:46px
}
.field input:focus,.field select:focus{border-color:var(--blue);background:var(--surface)}
.row{display:flex;gap:9px;align-items:center}
.row.btns{flex-wrap:wrap}
.sep{color:var(--dim);font-size:13px}
.switch{display:flex;align-items:center;gap:11px;font-size:14px;cursor:pointer;min-height:44px}
.switch input{
  width:48px;height:28px;appearance:none;-webkit-appearance:none;background:#CDD0D5;border-radius:999px;
  position:relative;cursor:pointer;transition:.22s;flex:0 0 48px;border:0
}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--blue)}
.switch input:checked::after{transform:translateX(20px)}
.hint{font-size:12px;color:var(--dim);line-height:1.65;margin:0}
.api-status{font-size:12.5px;color:var(--dim);font-weight:600}
.api-status.ok{color:var(--ok)}
.api-status.err{color:var(--danger)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:rgba(28,30,38,.94);color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;
  z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:82vw;text-align:center;box-shadow:var(--shadow-2)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 页内提醒横幅（系统通知不可用时的替身） */
.banner{
  position:fixed;z-index:95;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-2);
  display:flex;gap:12px;align-items:flex-start;padding:14px;animation:bannerIn .32s cubic-bezier(.2,1.25,.4,1)
}
@keyframes bannerIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
.banner-orb{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow-blue);
  animation:pulseRing 1.6s ease-in-out infinite
}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(0,100,224,.35)}50%{box-shadow:0 0 0 10px rgba(0,100,224,0)}}
.banner-body{flex:1;min-width:0}
.banner-title{font-weight:800;font-size:14.5px}
.banner-text{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.55}
.banner-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner-btn{
  border:0;border-radius:999px;padding:9px 15px;min-height:38px;font-size:13px;font-weight:700;
  background:var(--grad);color:#fff;cursor:pointer;box-shadow:var(--shadow-blue)
}
.banner-btn.ghost{background:var(--surface-2);color:var(--dim);box-shadow:none}
.banner-x{border:0;background:transparent;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;width:28px;height:28px;flex:0 0 28px}

.pet-dock.dragging .pet-svg{animation:none}

/* ==================== 移动端（荣耀 / Android） ==================== */
@media (max-width:640px){
  .panel{
    top:auto;right:8px;left:8px;bottom:8px;width:auto;height:70vh;
    border-radius:28px 28px 22px 22px;
  }
  .panel.collapsed{transform:translateY(calc(100% + 24px));opacity:0}
  .panel-head{padding:14px 14px 8px}
  .panel-title{font-size:17px}
  .tab{font-size:14px;padding:11px 0;min-height:44px}
  .tab-body{padding:0 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .msg{font-size:14.5px;max-width:90%}
  .task{padding:13px}
  .t-op{padding:9px 12px;font-size:13px;min-height:38px}
  /* 面板打开时光球上移到面板上方，避免互相遮挡、也不挡住底部按钮 */
  body.panel-open .pet-dock{right:14px;bottom:calc(70vh + 14px)}
  .pet-stage{width:104px;height:104px}
  .pt-btn{width:40px;height:40px}
  .bubble{max-width:min(300px,78vw)}
  .composer textarea,.quick-form input{font-size:15px}
  .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  .pet-stage{width:92px;height:92px}
  .panel{height:74vh}
  body.panel-open .pet-dock{bottom:calc(74vh + 12px)}
}
/* 桌面端：面板打开时给光球让位 */
@media (min-width:641px){
  body.panel-open .pet-dock{right:436px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}

<script>
/* store.js —— 数据层：持久化、任务模型、事件总线、日期工具 */
window.PTB = window.PTB || {};

(function (PTB) {
  'use strict';

  var KEY = 'ptb.state.v1';

  /* ---------------- 事件总线 ---------------- */
  var handlers = {};
  PTB.bus = {
    on: function (name, fn) { (handlers[name] = handlers[name] || []).push(fn); },
    emit: function (name, payload) {
      (handlers[name] || []).forEach(function (fn) {
        try { fn(payload); } catch (e) { console.error('[bus]', name, e); }
      });
    }
  };

  /* ---------------- 日期工具 ---------------- */
  var D = {
    pad: function (n) { return String(n).padStart(2, '0'); },
    todayKey: function (d) { d = d || new Date(); return d.getFullYear() + '-' + D.pad(d.getMonth() + 1) + '-' + D.pad(d.getDate()); },
    // -> "MM-DD HH:mm"
    short: function (iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + D.pad(d.getHours()) + ':' + D.pad(d.getMinutes());
    },
    clock: function (iso) { var d = new Date(iso); return D.pad(d.getHours()) + ':' + D.pad(d.getMinutes()); },
    dayDiff: function (iso) {
      var d = new Date(iso); d.setHours(0, 0, 0, 0);
      var t = new Date(); t.setHours(0, 0, 0, 0);
      return Math.round((d - t) / 86400000);
    },
    minutesBetween: function (a, b) { return Math.round((new Date(b) - new Date(a)) / 60000); },
    // 相对今天计算截止日期的口语描述
    humanDue: function (iso) {
      if (!iso) return '无期限';
      var diff = D.dayDiff(iso);
      var name = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '后天' : diff === -1 ? '昨天'
        : (diff < 0 ? Math.abs(diff) + '天前' : diff + '天后');
      return name + ' ' + D.clock(iso);
    },
    remaining: function (iso) {
      var ms = new Date(iso) - Date.now();
      if (ms < 0) return '已逾期 ' + D.humanSpan(-ms);
      return '还剩 ' + D.humanSpan(ms);
    },
    humanSpan: function (ms) {
      var m = Math.round(ms / 60000);
      if (m < 1) return '不到1分钟';
      if (m < 60) return m + '分钟';
      var h = Math.floor(m / 60), r = m % 60;
      if (h < 24) return h + '小时' + (r ? r + '分' : '');
      var d = Math.floor(h / 24), rh = h % 24;
      return d + '天' + (rh ? rh + '小时' : '');
    },
    // 今天某个 HH:mm 的时间戳
    atToday: function (hm, baseDate) {
      var p = (hm || '09:00').split(':');
      var d = baseDate ? new Date(baseDate) : new Date();
      d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
      return d;
    },
    addDays: function (date, n) { var d = new Date(date); d.setDate(d.getDate() + n); return d; },
    isoOf: function (d) { return new Date(d).toISOString(); }
  };
  PTB.D = D;

  /* ---------------- 默认状态 ---------------- */
  function defaults() {
    return {
      v: 1,
      settings: {
        apiKey: '',            // 混淆后存储
        model: 'deepseek-chat',
        persona: 'cheer',
        petName: '团仔',
        voice: false,
        dailyCheckIn: true,
        wakeTime: '09:00',
        reviewTime: '',
        quietStart: '23:00',
        quietEnd: '07:30',
        idleMinutes: 12,
        focusMinutes: 25,
        leadMinutes: [1440, 180, 30, 0],
        proactive: true
      },
      tasks: [],
      chat: [],
      plan: { blocks: [], date: '', summary: '' },
      pet: { mood: 'idle', level: 1, exp: 0, pos: null },
      stats: { completed: 0, created: 0, lastCheckIn: '', lastReview: '', streak: 0, lastDoneDate: '' },
      nudgeLog: {},          // taskId -> {last:ts, count:n}
      lastActivity: Date.now()
    };
  }

  var state = null;

  function deepMerge(base, patch) {
    if (!patch || typeof patch !== 'object') return base;
    Object.keys(base).forEach(function (k) {
      if (!(k in patch)) return;
      var b = base[k], p = patch[k];
      if (Array.isArray(b)) { if (Array.isArray(p)) base[k] = p; }
      else if (b && typeof b === 'object') base[k] = deepMerge(b, p);
      else if (typeof p === typeof b || b === null) base[k] = p;
    });
    return base;
  }

  function load() {
    var fresh = defaults();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return fresh;
      return deepMerge(fresh, JSON.parse(raw));
    } catch (e) {
      console.warn('状态损坏，已重置', e);
      return fresh;
    }
  }

  state = load();

  var saveTimer = null;
  function save(immediate) {
    if (saveTimer) clearTimeout(saveTimer);
    var doSave = function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { console.error('保存失败', e); }
    };
    if (immediate) doSave(); else saveTimer = setTimeout(doSave, 180);
  }

  /* ---------------- Key 混淆（本地防窥，非加密） ---------------- */
  function obf(str) {
    if (!str) return '';
    try { return btoa(unescape(encodeURIComponent('_ptb_' + str))); } catch (e) { return ''; }
  }
  function deobf(str) {
    if (!str) return '';
    try {
      var s = decodeURIComponent(escape(atob(str)));
      return s.indexOf('_ptb_') === 0 ? s.slice(5) : '';
    } catch (e) { return ''; }
  }

  function uid() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ---------------- 任务 CRUD ---------------- */
  var Task = {
    create: function (data) {
      var t = {
        id: uid(),
        title: (data.title || '').trim() || '未命名任务',
        note: data.note || '',
        deadline: data.deadline || null,
        estimate: data.estimate || 30,
        priority: data.priority || 'mid',
        tags: data.tags || [],
        status: 'todo',
        progress: 0,
        subtasks: data.subtasks || [],
        planStart: data.planStart || null,
        planEnd: data.planEnd || null,
        createdAt: new Date().toISOString(),
        startedAt: null,
        completedAt: null,
        source: data.source || 'manual',
        firedLeads: []
      };
      state.tasks.push(t);
      state.stats.created++;
      save();
      PTB.bus.emit('tasks:changed', state.tasks);
      return t;
    },
    get: function (id) { return state.tasks.filter(function (t) { return t.id === id; })[0] || null; },
    update: function (id, patch) {
      var t = Task.get(id); if (!t) return null;
      Object.keys(patch).forEach(function (k) { t[k] = patch[k]; });
      save();
      PTB.bus.emit('tasks:changed', state.tasks);
      return t;
    },
    remove: function (id) {
      state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
      save();
      PTB.bus.emit('tasks:changed', state.tasks);
    },
    toggle: function (id) {
      var t = Task.get(id); if (!t) return;
      var done = t.status !== 'done';
      t.status = done ? 'done' : 'todo';
      t.progress = done ? 100 : 0;
      t.completedAt = done ? new Date().toISOString() : null;
      if (t.subtasks && t.subtasks.length) {
        t.subtasks.forEach(function (s) { s.done = done; });
      }
      if (done) {
        state.stats.completed++;
        var today = D.todayKey();
        if (state.stats.lastDoneDate !== today) {
          var y = D.todayKey(D.addDays(new Date(), -1));
          state.stats.streak = state.stats.lastDoneDate === y ? state.stats.streak + 1 : 1;
          state.stats.lastDoneDate = today;
        }
      }
      save();
      PTB.bus.emit('tasks:changed', state.tasks);
      PTB.bus.emit(done ? 'task:done' : 'task:undone', t);
    },
    open: function () {
      return state.tasks.filter(function (t) { return t.status !== 'done'; });
    },
    todayOpen: function () {
      var k = D.todayKey();
      return Task.open().filter(function (t) {
        return (t.deadline && D.todayKey(new Date(t.deadline)) <= k) || (!t.deadline && D.todayKey(new Date(t.createdAt)) <= k);
      });
    },
    overdue: function () {
      return Task.open().filter(function (t) { return t.deadline && new Date(t.deadline) < Date.now(); });
    }
  };

  /* ---------------- 聊天记忆 ---------------- */
  var Chat = {
    push: function (role, content, extra) {
      var m = { role: role, content: content, ts: Date.now() };
      if (extra) Object.keys(extra).forEach(function (k) { m[k] = extra[k]; });
      state.chat.push(m);
      if (state.chat.length > 120) state.chat = state.chat.slice(-120);
      save();
      PTB.bus.emit('chat:new', m);
      return m;
    },
    recent: function (n) {
      return state.chat.slice(-(n || 16)).map(function (m) { return { role: m.role, content: m.content }; });
    },
    clear: function () { state.chat = []; save(); PTB.bus.emit('chat:changed'); }
  };

  /* ---------------- 导出接口 ---------------- */
  PTB.store = {
    get state() { return state; },
    get settings() { return state.settings; },
    save: save,
    apiKey: function () { return deobf(state.settings.apiKey); },
    setApiKey: function (k) { state.settings.apiKey = obf(k); save(true); },
    Task: Task,
    Chat: Chat,
    uid: uid,
    reset: function () { state = defaults(); save(true); PTB.bus.emit('tasks:changed', state.tasks); },
    replaceState: function (obj) { state = obj; save(true); PTB.bus.emit('tasks:changed', state.tasks); },
    touchActivity: function () { state.lastActivity = Date.now(); },
    inQuietHours: function (now) {
      var s = state.settings;
      if (!s.quietStart || !s.quietEnd) return false;
      now = now || new Date();
      var cur = now.getHours() * 60 + now.getMinutes();
      var a = D.atToday(s.quietStart);
      var b = D.atToday(s.quietEnd);
      var start = a.getHours() * 60 + a.getMinutes();
      var end = b.getHours() * 60 + b.getMinutes();
      if (start === end) return false;
      return start < end ? (cur >= start && cur < end) : (cur >= start || cur < end);
    }
  };
})(window.PTB);

<script>
/* ds.js —— DeepSeek 客户端：聊天、任务抽取、卡点辅导 */
window.PTB = window.PTB || {};

(function (PTB) {
  'use strict';

  var ENDPOINT = 'https://api.deepseek.com/chat/completions';
  var TIMEOUT = 60000;

  var PERSONA = {
    cheer: {
      name: '元气鼓励型',
      tone: '活泼、元气、爱用 emoji，像一个陪你写作业的好朋友。善于把大事拆小，先肯定再提建议。'
    },
    tough: {
      name: '毒舌监工型',
      tone: '嘴硬心软的监工，吐槽你不行动但真的在帮你，毒舌但每句都指向下一步动作，不说废话。'
    },
    gentle: {
      name: '温柔陪伴型',
      tone: '轻声细语、体贴、能接住焦虑，先共情再给一个最小可行的下一步。'
    },
    nerd: {
      name: '理性分析型',
      tone: '冷静、结构化、喜欢列点和给框架，优先给可执行清单和风险提示。'
    }
  };

  function key() { return PTB.store.apiKey(); }

  function hasKey() { return !!key(); }

  function buildSystem(extra) {
    var s = PTB.store.settings;
    var p = PERSONA[s.persona] || PERSONA.cheer;
    var now = new Date();
    var ctx = [
      '你是「' + (s.petName || '团仔') + '」，一个住在用户桌面的桌宠任务管家。',
      '性格设定：' + p.tone,
      '当前时间：' + PTB.D.isoOf(now).slice(0, 10) + ' ' + PTB.D.clock(new Date()) + '（星期' + '日一二三四五六'[now.getDay()] + '）。',
      '你掌握用户的任务清单与截止日期，职责是：帮他理顺排程、在他没进展时主动推一把、把卡住的事拆成 15 分钟内能动手的第一步。',
      '规则：',
      '1. 说话简短，中文，每段不超过 3 句，除非用户在问复杂问题。',
      '2. 永远给出「下一步具体动作」，不要空泛鼓励。',
      '3. 涉及任务增删改时先说我帮你记下了，再复述要点。',
      '4. 不要输出 Markdown 标题和代码块，用朴素口语。'
    ];
    if (extra) ctx = ctx.concat(extra);
    return ctx.join('\n');
  }

  function taskDigest() {
    var tasks = PTB.store.Task.open().slice(0, 25);
    if (!tasks.length) return '当前没有未完成任务。';
    return tasks.map(function (t, i) {
      return (i + 1) + '. ' + t.title +
        (t.deadline ? '｜截止 ' + PTB.D.short(t.deadline) + '（' + PTB.D.remaining(t.deadline) + '）' : '｜无期限') +
        '｜预估 ' + (t.estimate || 30) + ' 分钟｜状态 ' + (t.status === 'doing' ? '进行中' : '待开始') +
        (t.subtasks && t.subtasks.length ? '｜子步骤 ' + t.subtasks.filter(function (s) { return s.done; }).length + '/' + t.subtasks.length : '');
    }).join('\n');
  }

  /* ---------------- 基础请求 ---------------- */
  function request(body, onToken) {
    return new Promise(function (resolve, reject) {
      if (!hasKey()) { reject(new Error('NO_KEY')); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('POST', ENDPOINT, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Authorization', 'Bearer ' + key());
      xhr.timeout = TIMEOUT;

      var seen = '';
      var timer = setTimeout(function () { try { xhr.abort(); } catch (e) {} }, TIMEOUT + 5000);

      if (onToken) {
        var lastLen = 0;
        xhr.onprogress = function () {
          var text = xhr.responseText || '';
          if (text.length === lastLen) return;
          lastLen = text.length;
          try {
            var lines = text.split('\n');
            var delta = '';
            for (var i = lines.length - 1; i >= 0; i--) {
              var line = lines[i].trim();
              if (!line) continue;
              if (line.indexOf('data:') !== 0) break;
              var payload = line.slice(5).trim();
              if (payload === '[DONE]') break;
              try {
                var j = JSON.parse(payload);
                var piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
                if (piece) { seen += piece; delta += piece; }
              } catch (e) { /* 忽略半行 */ }
              if (delta) break;
            }
            if (delta) onToken(delta, seen);
          } catch (e) { /* 流式解析容错 */ }
        };
      }

      xhr.onload = function () {
        clearTimeout(timer);
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300 && data) {
          if (onToken) { resolve({ content: seen || (data.choices && data.choices[0].message.content) || '' }); return; }
          var c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
          resolve({ content: c || '', raw: data });
        } else {
          var msg = (data && data.error && data.error.message) || ('HTTP ' + xhr.status);
          reject(new Error(msg));
        }
      };
      xhr.onerror = function () { clearTimeout(timer); reject(new Error('连不上 AI：浏览器拦截了跨域请求（直接打开本地文件会这样），请安装 App 使用；也可能是网络断了')); };
      xhr.ontimeout = function () { clearTimeout(timer); reject(new Error('请求超时')); };
      xhr.send(JSON.stringify(body));
    });
  }

  /* ---------------- 对话 ---------------- */
  function chat(userText, opts) {
    opts = opts || {};
    var msgs = [{ role: 'system', content: buildSystem(opts.systemExtra ? [opts.systemExtra] : null) }];
    msgs = msgs.concat(PTB.store.Chat.recent(opts.memory === undefined ? 12 : opts.memory));
    msgs.push({ role: 'user', content: userText });

    return request({
      model: PTB.store.settings.model || 'deepseek-chat',
      messages: msgs,
      temperature: opts.temperature || 0.8,
      max_tokens: opts.max_tokens || 700,
      stream: !!opts.onToken
    }, opts.onToken);
  }

  function test() {
    return new Promise(function (resolve, reject) {
      request({
        model: PTB.store.settings.model || 'deepseek-chat',
        messages: [{ role: 'user', content: '只回复两个字：在呢' }],
        max_tokens: 10
      }).then(function (r) { resolve(r.content.trim()); }).catch(reject);
    });
  }

  /* ---------------- 结构化：从自然语言中抽取任务 ---------------- */
  var EXTRACT_SYS = [
    '你是任务解析引擎。把用户的自然语言输入解析成结构化任务清单。',
    '必须只输出 JSON，格式如下（不要输出多余文字）：',
    '{"reply":"桌宠口吻的一句话确认，最多 30 字","tasks":[{"title":"动词开头的任务标题","deadline":"YYYY-MM-DD HH:mm 或 null","estimate":预估分钟数,"priority":"high|mid|low","subtasks":["15分钟内能做完的第一步","第二步"]}]}',
    '时间推断规则：以当前时间为准推断「明天下午三点」这类相对时间；没有明确时间的 deadline 填 null；预估分钟数填整数，默认 30；副task 只在用户说不清楚或任务较大时给 2-4 步，否则空数组。'
  ].join('\n');

  function parseTasks(text) {
    var body = {
      model: PTB.store.settings.model || 'deepseek-chat',
      messages: [
        { role: 'system', content: EXTRACT_SYS + '\n当前时间：' + PTB.D.isoOf(new Date()).slice(0, 16).replace('T', ' ') },
        { role: 'user', content: text }
      ],
      response_format: { type: 'json_object' },
      temperature: 0.2,
      max_tokens: 900
    };
    return request(body).then(function (r) { return safeJson(r.content); });
  }

  function safeJson(txt) {
    if (!txt) throw new Error('空响应');
    try { return JSON.parse(txt); } catch (e) { /* 继续尝试 */ }
    var m = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (m) { try { return JSON.parse(m[1]); } catch (e2) {} }
    var s = txt.indexOf('{'), e3 = txt.lastIndexOf('}');
    if (s > -1 && e3 > s) {
      try { return JSON.parse(txt.slice(s, e3 + 1)); } catch (e4) {}
    }
    throw new Error('无法解析返回结果');
  }

  /* ---------------- 结构化：卡点诊断与拆解 ---------------- */
  var COACH_SYS = [
    '你是效率教练。用户正卡在某件事上（可能是拖延、不清楚怎么下手、被别的事打断、或遇到技术障碍）。',
    '只输出 JSON：{"reply":"先共情一句+点破卡住的真正原因，50 字以内","steps":["15 分钟内能动手的第一步","第二步","第三步"],"question":"一个能帮用户继续说清楚处境的追问"}',
    '要求：步骤必须具体到能在 5-15 分钟执行完，动词开头，不要大词；steps 给 3 条。'
  ].join('\n');

  function coach(taskTitle, context) {
    var body = {
      model: PTB.store.settings.model || 'deepseek-chat',
      messages: [
        { role: 'system', content: COACH_SYS },
        { role: 'user', content: '卡住的任务：' + taskTitle + '\n补充：' + (context || '无') + '\n其他待办：\n' + taskDigest() }
      ],
      response_format: { type: 'json_object' },
      temperature: 0.7,
      max_tokens: 600
    };
    return request(body).then(function (r) { return safeJson(r.content); });
  }

  /* ---------------- 结构化：每日盘问的开场白 / 复盘 ---------------- */
  function greet(kind) {
    var prompt = kind === 'review'
      ? '现在是晚间复盘时间。请生成一段 60 字以内的晚间复盘开场：肯定今天完成的事、点出没做完但不责备、问一句明天最重要的一件事是什么。'
      : '现在是每日待办采集时间。请用桌宠口吻生成 50 字以内的开场：先简短招呼，然后请用户一口气把今天的待办和各自截止时间说出来，并举例说明说法（例如"下午三点前把方案初稿发给王总，大概40分钟"）。';
    return chat(prompt, { memory: 2, max_tokens: 200, temperature: 0.9 });
  }

  PTB.ds = {
    ENDPOINT: ENDPOINT,
    hasKey: hasKey,
    setEndpoint: function (u) { ENDPOINT = u; },
    chat: chat,
    test: test,
    parseTasks: parseTasks,
    coach: coach,
    greet: greet,
    taskDigest: taskDigest,
    buildSystem: buildSystem,
    PERSONA: PERSONA,
    safeJson: safeJson
  };
})(window.PTB);

<script>
/* scheduler.js —— 排程引擎：把任务按截止日期塞进时间轴 */
window.PTB = window.PTB || {};

(function (PTB) {
  'use strict';

  var WORK_START = '09:00';
  var WORK_END = '22:00';
  var CHUNK = 45;          // 单块最大专注时长
  var BREAK = 8;           // 块间休息

  function minsOf(hm) { var p = hm.split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function hmOf(m) { var h = Math.floor(m / 60), r = m % 60; return PTB.D.pad(h) + ':' + PTB.D.pad(r); }

  function score(t) {
    var s = 0;
    if (t.priority === 'high') s -= 300;
    if (t.priority === 'low') s += 300;
    if (!t.deadline) return s + 1e6;
    var left = (new Date(t.deadline) - Date.now()) / 60000;
    if (left < 0) return s - 1e5;          // 逾期优先
    return s + left;                        // 越紧急越靠前
  }

  /* 生成计划：返回 [{taskId,title,start,end,dateKey}] */
  function buildPlan() {
    var open = PTB.store.Task.open().slice();
    var today = PTB.D.todayKey();
    open.sort(function (a, b) { return score(a) - score(b); });

    var blocks = [];
    if (!open.length) {
      PTB.store.state.plan = { blocks: [], date: today, summary: '今天没有待办，先休息一下或新增任务吧。' };
      PTB.store.save();
      return PTB.store.state.plan;
    }

    var now = new Date();
    var endMin = minsOf(WORK_END);
    var MAX_DAY = 2;
    var overflow = [];

    // 游标：今天当前时间向上取整到 15 分钟，且不早于工作时段开始
    var cursor = new Date(now.getTime());
    cursor.setMinutes(Math.ceil(cursor.getMinutes() / 15) * 15, 0, 0);
    if (cursor.getHours() * 60 + cursor.getMinutes() < minsOf(WORK_START)) {
      cursor = PTB.D.atToday(WORK_START);
    }
    if (cursor.getHours() * 60 + cursor.getMinutes() >= endMin) {
      cursor = PTB.D.atToday(WORK_START, PTB.D.addDays(now, 1));
    }

    function dayIndexOf(d) {
      return Math.round((new Date(PTB.D.todayKey(d) + 'T00:00:00') - new Date(PTB.D.todayKey(now) + 'T00:00:00')) / 86400000);
    }

    // 轮转分配：先给每个任务一个 45 分钟块，再回头补第二轮，避免大任务独占整天
    var pool = open.map(function (t) {
      return { t: t, need: Math.max(10, Math.min(t.estimate || 30, 240)) };
    });
    var overflow = [];
    var guard = 0;

    function advanceToValid() {
      // 把游标推进到「当天工作时段内」的合法位置，跨过非工作时段
      if (cursor >= PTB.D.atToday(WORK_END, cursor)) {
        cursor = PTB.D.atToday(WORK_START, PTB.D.addDays(cursor, 1));
      }
      if (cursor < PTB.D.atToday(WORK_START, cursor)) {
        cursor = PTB.D.atToday(WORK_START, cursor);
      }
      if (cursor < now) cursor = new Date(now.getTime());
    }

    function placeOne(r) {
      var tries = 0;
      while (tries < 4) {
        tries++;
        advanceToValid();
        var off = Math.max(0, dayIndexOf(cursor));
        if (off > MAX_DAY) return false;
        var curMin = cursor.getHours() * 60 + cursor.getMinutes();
        var room = endMin - curMin;
        if (room <= 0) { cursor = PTB.D.atToday(WORK_START, PTB.D.addDays(cursor, 1)); continue; }
        var take = Math.min(CHUNK, r.need, room);
        var bstart = new Date(cursor.getTime());
        var bend = new Date(cursor.getTime() + take * 60000);
        blocks.push({
          taskId: r.t.id,
          title: r.t.title,
          start: bstart.toISOString(),
          end: bend.toISOString(),
          dateKey: PTB.D.todayKey(cursor)
        });
        if (!r.t.planStart) { r.t.planStart = bstart.toISOString(); r.t.planEnd = bend.toISOString(); }
        r.need -= take;
        cursor = new Date(bend.getTime() + BREAK * 60000);
        return true;
      }
      return false;
    }

    while (pool.some(function (r) { return r.need > 0; }) && guard < 300) {
      guard++;
      var progressed = false;
      for (var j = 0; j < pool.length; j++) {
        if (pool[j].need <= 0) continue;
        if (!placeOne(pool[j])) { break; }
        progressed = true;
      }
      if (!progressed) break;
    }

    pool.forEach(function (r) { if (r.need > 0) overflow.push(r.t.title); });

    // 汇总今天
    var todayBlocks = blocks.filter(function (b) { return b.dateKey === today; });
    var totalMin = todayBlocks.reduce(function (a, b) { return a + (new Date(b.end) - new Date(b.start)) / 60000; }, 0);
    var summary = '今天安排 ' + todayBlocks.length + ' 个时间块，共约 ' + Math.round(totalMin) + ' 分钟；' +
      '未完成 ' + PTB.store.Task.open().length + ' 项，其中逾期 ' + PTB.store.Task.overdue().length + ' 项。' +
      (overflow.length ? ' ⚠️ 排不下（时间不够）：' + overflow.slice(0, 3).join('、') : '');

    PTB.store.state.plan = { blocks: blocks, date: today, summary: summary, overflow: overflow };
    PTB.store.save();
    return PTB.store.state.plan;
  }

  /* 现在该做什么 */
  function nextUp() {
    var now = Date.now();
    var blocks = PTB.store.state.plan.blocks || [];
    var upcoming = blocks.filter(function (b) { return new Date(b.end) > now; });
    if (!upcoming.length) return null;
    upcoming.sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
    return upcoming[0];
  }

  /* 当前时间正在进行的块 */
  function currentBlock() {
    var now = Date.now();
    var blocks = PTB.store.state.plan.blocks || [];
    return blocks.filter(function (b) { return new Date(b.start) <= now && new Date(b.end) >= now; })[0] || null;
  }

  /* 是否今天的计划已排过 */
  function isFresh() {
    return PTB.store.state.plan.date === PTB.D.todayKey() && (PTB.store.state.plan.blocks || []).length > 0;
  }

  /* 空闲时间评估：今天剩余未安排的空档 */
  function freeWindows(dateKey) {
    var day = PTB.store.state.plan.blocks.filter(function (b) { return b.dateKey === dateKey; });
    return { blocks: day, start: WORK_START, end: WORK_END, chunk: CHUNK };
  }

  PTB.scheduler = {
    buildPlan: buildPlan,
    nextUp: nextUp,
    currentBlock: currentBlock,
    isFresh: isFresh,
    freeWindows: freeWindows,
    hmOf: hmOf,
    minsOf: minsOf,
    WORK_START: WORK_START,
    WORK_END: WORK_END
  };
})(window.PTB);
